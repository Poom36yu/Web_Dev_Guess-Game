
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <h2>Guess Game</h2>

        <div class="instructions">
            Guess a number between 1 - 20.
            You have 5 chances!
        </div>

        <div class="input">
            <input
                type="number"
                id="guess-value"
                name="guess-value"
                min="1"
                max="20"
                placeholder="Enter your guess"
                hidden
            >

            <button id="guess-btn" hidden>Guess!</button>
            <button id="restart-btn">Restart</button>
        </div>

        <hr>

        <div id="attempt-text">
            Attempt <span id="attempt">0</span>/5
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
